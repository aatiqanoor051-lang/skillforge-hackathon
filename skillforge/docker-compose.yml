version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: skillforge-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-skillforge_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_production}
      MONGO_INITDB_DATABASE: skillforge
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillforge-net

  python-service:
    build:
      context: ./python-service
    container_name: skillforge-python-service
    restart: unless-stopped
    environment:
      PY_PORT: 5001
      PY_CORS_ORIGINS: http://backend:5000,http://localhost:5000,http://localhost:5173
    ports:
      - '5001:5001'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5001/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - skillforge-net

  backend:
    build:
      context: ./backend
    container_name: skillforge-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-skillforge_admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_production}@mongo:27017/skillforge?authSource=admin
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      PYTHON_SERVICE_URL: http://python-service:5001
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-20}
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1800}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
    ports:
      - '5000:5000'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - skillforge-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: skillforge-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '5173:80'
    networks:
      - skillforge-net

volumes:
  mongo_data:

networks:
  skillforge-net:
    driver: bridge
