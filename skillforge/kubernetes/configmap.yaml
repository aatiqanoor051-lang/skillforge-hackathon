apiVersion: v1
kind: ConfigMap
metadata:
  name: skillforge-config
  namespace: skillforge
data:
  NODE_ENV: "production"
  PORT: "5000"
  PY_PORT: "5001"
  CLIENT_ORIGIN: "https://skillforge.example.com"
  PYTHON_SERVICE_URL: "http://python-service:5001"
  PY_CORS_ORIGINS: "http://backend:5000"
  JWT_EXPIRES_IN: "7d"
  BCRYPT_SALT_ROUNDS: "10"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
  AI_RATE_LIMIT_MAX: "20"
  ENABLE_DEMO_ACCOUNTS: "false"
  AI_BASE_URL: "https://api.openai.com/v1"
  AI_MODEL: "gpt-4o-mini"
  AI_MAX_TOKENS: "1800"
  AI_TEMPERATURE: "0.4"
  VITE_API_BASE_URL: "https://api.skillforge.example.com/api"
