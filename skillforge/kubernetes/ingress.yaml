apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillforge-ingress
  namespace: skillforge
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - skillforge.example.com
        - api.skillforge.example.com
      secretName: skillforge-tls
  rules:
    - host: skillforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.skillforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
