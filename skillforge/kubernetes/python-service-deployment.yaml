apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          image: skillforge/python-service:latest
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: skillforge-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: skillforge
spec:
  selector:
    app: python-service
  ports:
    - port: 5001
      targetPort: 5001
